# Continuation to 10x messaging steps (messaging converged at 1000): resumes the 2x run's
# final checkpoint (weights only, fresh optimizer) and trains the remaining 8x. Launched
# 2026-08-14, user-authorized.
common_root:
  - configs/base.yaml
  - configs/model_sweep/condition_steg_reasoning.yaml

experiments:
  - config:
      name: steg_reasoning_gptoss_120b_cont10x
      function_kwargs:
        model_name: "openai/gpt-oss-120b"
        renderer_name: gpt_oss_no_sysprompt
        sft:
          learning_rate: 1.138e-4   # hidden 2880
          num_epochs: 10
          max_steps: 8000
          load_checkpoint_path: tinker://a4094bc9-6a9b-5c05-bc33-56db46e80941:train:0/weights/final

common_patch:
  - wandb_group: model_sweep/steg_reasoning
