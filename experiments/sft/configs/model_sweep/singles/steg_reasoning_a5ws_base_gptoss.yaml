# Base-SFT (no min_prefix) steg reasoning, gpt-oss on a5ws: max_steps = 2x its BASE
# messaging stop (1200). The min_prefix version nearly crossed at 2x (0.931@1600); the
# question is whether full-cover targets slow the reasoning breakthrough more than the
# 1.5x they slowed messaging. Launched 2026-08-16, user-authorized ($450 direction).
common_root:
  - configs/base.yaml
  - configs/model_sweep/condition_steg_reasoning_a5ws.yaml

experiments:
  - config:
      name: steg_reasoning_a5ws_base_gptoss_120b
      log_file_path: results/model_sweep/steg_reasoning_a5ws_base/RUN_NAME/logs.txt
      save_config_path: results/model_sweep/steg_reasoning_a5ws_base/RUN_NAME/config.yaml
      function_kwargs:
        log_path: results/model_sweep/steg_reasoning_a5ws_base/RUN_NAME
        model_name: "openai/gpt-oss-120b"
        renderer_name: gpt_oss_no_sysprompt
        min_prefix: false
        sft:
          learning_rate: 1.138e-4
          max_steps: 2400   # 2x base messaging (1200)

common_patch:
  - wandb_group: model_sweep/steg_reasoning_a5ws_base
