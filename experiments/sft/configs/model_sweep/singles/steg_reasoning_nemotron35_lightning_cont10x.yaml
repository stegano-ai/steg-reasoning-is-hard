# Continuation to 10x messaging steps (messaging converged at 2100): resumes the 2x run's
# final checkpoint (weights only, fresh optimizer) and trains the remaining 8x. Launched
# 2026-08-14, user-authorized.
common_root:
  - configs/base.yaml
  - configs/model_sweep/condition_steg_reasoning.yaml

experiments:
  - config:
      name: steg_reasoning_nemotron35_lightning_cont10x
      function_kwargs:
        model_name: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16"
        renderer_name: nemotron3_ultra_disable_thinking
        sft:
          learning_rate: 1.219e-4   # hidden 2688
          num_epochs: 10
          max_steps: 16800
          load_checkpoint_path: tinker://8ccefc23-ac7a-5151-9444-b913afe0fbe5:train:0/weights/final

common_patch:
  - wandb_group: model_sweep/steg_reasoning
