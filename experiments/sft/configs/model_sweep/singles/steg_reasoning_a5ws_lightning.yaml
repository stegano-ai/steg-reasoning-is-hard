# a5ws phase 2, Lightning: max_steps = 2x its messaging early-stop step (1900, relaunched
# run). Launched 2026-08-15, part of the user-authorized a5ws phase-2 sweep.
common_root:
  - configs/base.yaml
  - configs/model_sweep/condition_steg_reasoning_a5ws.yaml

experiments:
  - config:
      name: steg_reasoning_a5ws_nemotron35_lightning
      function_kwargs:
        model_name: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16"
        renderer_name: nemotron3_ultra_disable_thinking
        sft:
          learning_rate: 1.219e-4
          max_steps: 3800   # 2x messaging (1900)

common_patch:
  - wandb_group: model_sweep/steg_reasoning_a5ws
