# a5ws steg reasoning continuation to 10x messaging steps for inkling_small: resumes the 2x
# run's final checkpoint (messaging S=300, 2x done, +2400 to cumulative 10x).
# Launched 2026-08-21, user-authorized ($250 envelope).
common_root:
  - configs/base.yaml
  - configs/model_sweep/condition_steg_reasoning_a5ws.yaml

experiments:
  - config:
      name: steg_reasoning_a5ws_inkling_small_cont10x
      function_kwargs:
        model_name: "thinkingmachines/Inkling-Small"
        renderer_name: tml_v0_no_thinking
        closed_prefix_targets: true
        sft:
          learning_rate: 1.6e-4
          num_epochs: 10
          max_steps: 2400
          load_checkpoint_path: tinker://4e38054c-a85a-5efa-bdde-19772fd28387:train:0/weights/final

common_patch:
  - wandb_group: model_sweep/steg_reasoning_a5ws
