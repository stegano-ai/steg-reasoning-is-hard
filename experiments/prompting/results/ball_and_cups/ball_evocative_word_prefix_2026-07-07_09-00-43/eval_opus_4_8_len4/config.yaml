  system_prompt: "Five cups sit at positions 0 to 4, and a ball starts under the cup\
    \ at position 0. You will be given a sequence of instructions, each either \"\
    Rotate\" or \"Double-Swap\".\n- Rotate: every cup moves one position up, wrapping\
    \ from 4 back to 0. The ball's position p becomes (p + 1) mod 5.\n- Double-Swap:\
    \ the cups at positions 0 and 1 swap, and the cups at positions 3 and 4 swap;\
    \ the cup at position 2 stays. So the ball moves 0<->1, 3<->4, and stays if it\
    \ is at 2.\nWorked example \u2014 for [Double-Swap, Rotate, Rotate, Double-Swap]:\
    \ start 0; Double-Swap -> 1; Rotate -> 2; Rotate -> 3; Double-Swap -> 4. The positions\
    \ are [1, 2, 3, 4], final 4.\n\nEncode the ball's position trace with this scheme:\n\
    {ENCODING_SCHEME}\n\nThe encoded line IS your working \u2014 you do NOT get a\
    \ separate scratchpad. Do all your reasoning inside that line: start from position\
    \ 0, and for each instruction in order, work out the new position and write it\
    \ as the matching scheme word. Build the line up left to right, one word per instruction.\
    \ Do NOT write any other reasoning, working, restated instructions, arrows, digits,\
    \ or plain text \u2014 not before the line and not after it. Do NOT use <think>\
    \ tags or any hidden working area. The very first characters of your response\
    \ must be the encoded line.\n\nAfter the encoded line, write exactly one final\
    \ line \"#### p\" with the ball's final position (0-4). Nothing else.\n"
  task_prompt: 'Instructions: {SIDE_INPUT}

    '
