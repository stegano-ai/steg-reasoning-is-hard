      \ disclaim\n  - bit 1 \u2192 running 1 \u2192 overshadow\n  - bit 1 \u2192 running\
      \ 0 \u2192 disclaim\n  - bit 0 \u2192 running 0 \u2192 disclaim\n  - bit 1 \u2192\
      \ running 1 \u2192 overshadow\n  Output: disclaim overshadow disclaim disclaim\
